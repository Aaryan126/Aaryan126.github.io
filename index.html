<!doctype html>
<html lang="en" class="no-transition">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaryan Kandiah | AI & Software Engineer</title>
    <meta name="description" content="Aaryan Kandiah builds AI systems and full-stack software for real-world problems. Explore projects and experience in agentic AI, software engineering, and customer-focused delivery." />
    <meta name="theme-color" content="#f4f2ec" />
    <meta property="og:title" content="Aaryan Kandiah | AI & Software Engineer" />
    <meta property="og:description" content="Selected work in AI engineering, full-stack software, and real-world problem solving." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/projects/boldr-signaldesk-echelon.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Set theme before first paint to prevent flash -->
    <script>
      (function() {
        var saved;
        try { saved = localStorage.getItem('theme'); } catch (_) {}
        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var preference = saved === 'dark' || saved === 'light' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var theme = reducedMotion ? preference : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Loading screen styles | inline so they render before any external CSS -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: opacity 0.5s ease, backdrop-filter 0.5s ease, -webkit-backdrop-filter 0.5s ease;
      }
      [data-theme="dark"] #loader {
        background: rgba(9, 9, 11, 0.25);
      }
      #loader.fade-out {
        opacity: 0;
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
        pointer-events: none;
      }
      #loader-logo {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      [data-theme="dark"] #loader-logo {
        border-color: rgba(255, 255, 255, 0.1);
        border-top-color: #a1a1aa;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Preconnect to font origins for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  </head>
  <body>
    <!-- Loading screen | visible immediately, hidden after app is ready -->
    <div id="loader">
      <div id="loader-logo"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
